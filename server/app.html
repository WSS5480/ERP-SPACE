<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12212E">
<title>ERP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312212E'/%3E%3Cpath d='M11.5 24V8.5h6a4.6 4.6 0 0 1 0 9.2h-6' fill='none' stroke='%23D98C4A' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  ERP. This page is a shell: every figure on it comes from /api after
  sign-in, and every piece of data is placed with textContent, never parsed as
  markup. Script and styles come only from this site (see the server's
  Content-Security-Policy).
-->
<link rel="stylesheet" href="/app.css?v=__VERSION__">
<script src="/app.js?v=__VERSION__" defer></script>
<!--MODULE_SCRIPTS-->
</head>
<body>

<div id="boot" class="boot"><div class="inner"><div class="spin"></div><div id="boot-msg">Loading…</div></div></div>

<div id="signin" class="signin" hidden>
  <form class="card" id="si-form" autocomplete="on" novalidate>
    <div class="brand">ERP</div>
    <h1 id="si-title">Sign in</h1>
    <p class="lead" id="si-msg">Sign in with your email and password.</p>
    <div class="seg si-mode" id="si-mode" role="group" aria-label="Who is signing in">
      <button type="button" data-mode="customer" aria-pressed="true">Business account</button>
      <button type="button" data-mode="operator" aria-pressed="false">ERP team</button>
    </div>
    <div id="si-customer">
      <label class="field"><span>Email</span>
        <input type="email" id="si-email" name="email" autocomplete="username" maxlength="200"></label>
      <label class="field" id="si-pass-f"><span>Password</span>
        <input type="password" id="si-pass" name="password" autocomplete="current-password" maxlength="200"></label>
      <label class="field" id="si-code-f" hidden><span>Six-digit code from the email</span>
        <input type="text" id="si-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*"></label>
    </div>
    <div id="si-operator" hidden>
      <label class="field"><span>Your name</span>
        <input type="text" id="si-name" name="username" autocomplete="username" maxlength="60"></label>
      <label class="field"><span>Password</span>
        <input type="password" id="si-key" name="password" autocomplete="current-password"></label>
    </div>
    <div id="si-setpw" hidden>
      <label class="field" id="si-newname-f"><span>Your name</span>
        <input type="text" id="si-newname" autocomplete="name" maxlength="80"></label>
      <label class="field"><span>New password (at least 10 characters)</span>
        <input type="password" id="si-new" autocomplete="new-password" maxlength="200"></label>
      <label class="field"><span>The same again</span>
        <input type="password" id="si-new2" autocomplete="new-password" maxlength="200"></label>
    </div>
    <button class="btn primary" type="submit" id="si-go">Sign in</button>
    <div class="result critical" id="si-err" role="alert" hidden></div>
    <div class="result good" id="si-ok" role="status" hidden></div>
    <p class="si-links" id="si-links">
      <button type="button" class="linkbtn" id="si-forgot">Forgot your password?</button>
      <button type="button" class="linkbtn" id="si-askcode">Email me a sign-in code instead</button>
      <button type="button" class="linkbtn" id="si-back" hidden>Back to sign in</button>
    </p>
    <p class="fine" id="si-fine">Your name is recorded on everything you do here.</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="side">
    <div class="side-top">
      <div class="brand">ERP</div>
      <div class="bar-actions">
        <button class="icon-btn" type="button" data-act="refresh" aria-label="Refresh"></button>
        <button class="icon-btn" type="button" data-act="signout" aria-label="Sign out"></button>
      </div>
    </div>
    <div class="ctx">
      <button class="switch" type="button" id="co-switch" aria-haspopup="dialog">
        <span class="sw-t"><span class="sw-k">Company</span><span class="sw-v" id="co-name">…</span></span>
      </button>
      <button class="switch" type="button" id="as-switch" aria-haspopup="dialog">
        <span class="sw-t"><span class="sw-k">Acting as</span><span class="sw-v" id="as-name">…</span></span>
      </button>
    </div>
    <nav id="nav" aria-label="Screens"></nav>
    <div class="who" id="who"></div>
    <div class="foot-actions">
      <button class="icon-btn" type="button" data-act="refresh"><span class="lbl">Refresh</span></button>
      <button class="icon-btn" type="button" data-act="signout"><span class="lbl">Sign out</span></button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Screens"></nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
