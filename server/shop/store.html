<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>__TITLE__</title>
<link rel="stylesheet" href="/shop/assets/store.css?v=__V__">
<style nonce="__NONCE__">:root{--brand:__BRAND__;--accent:__ACCENT__}</style>
<script src="/shop/assets/store.js?v=__V__" defer></script>
</head>
<body data-slug="__SLUG__">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="logo" id="logo" href="#/">__TITLE__</a>
    <form class="search" id="search" role="search">
      <label class="sr" for="q">Search the store</label>
      <input id="q" name="q" type="search" placeholder="Search sofas, beds, lamps…" autocomplete="off" maxlength="80">
    </form>
    <a class="cart-link" id="cart-link" href="#/cart" aria-label="Cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.3l2-8H6.4"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>
      <span class="count" id="cart-count" hidden>0</span>
    </a>
  </div>
  <nav class="cats" id="cats" aria-label="Departments"></nav>
</header>
<main id="main" tabindex="-1"><div class="loading"><span class="spin"></span>Loading the store…</div></main>
<footer class="foot" id="foot"></footer>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p class="wrap">This store needs JavaScript turned on.</p></noscript>
</body>
</html>
