# Render Blueprint for the ERP.
#
# This is the whole stack in one file: the database, the API, and (on a paid
# plan) the scheduler. It is what Render builds when you create a Blueprint
# from this repository, and it is the record of how the environment is meant
# to look even when resources were created some other way.
#
# AS RUNNING (Nov 2026): the service is "ERP-api" (its address stays
# pentex-erp-api.onrender.com, which Render does not change on a rename). It
# has no database of its own: DATABASE_URL is APPS-db's internal URL, set by
# hand, and ERP_DB_SCHEMA=erp keeps every ERP table in its own schema there.
# The databases block below is what a fresh Blueprint would create instead.
#
# FREE TRIAL, as originally configured. Three consequences worth knowing:
#   - Render deletes a free database 30 days after creation, and free
#     databases have no backups. Nothing real should live here.
#   - The API sleeps after 15 idle minutes and takes about a minute to wake.
#   - Render has no free cron, so scheduled SFTP and API pulls do not run on
#     their own. POST /api/connections/{id}/run runs one on demand instead.
#
# To move to a real environment: change both `plan: free` lines, uncomment the
# cron job, and set ERP_SEED to nothing so placeholder data is never loaded.

databases:
  - name: erp-db
    plan: free
    region: ohio
    databaseName: erp
    user: erp
    postgresMajorVersion: "16"

services:
  - type: web
    name: ERP-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      # Operator key for every /api route. Render generates it; read it from
      # the service's Environment tab. Never commit it.
      - key: ERP_API_TOKEN
        generateValue: true
      # Separate key for the inbound-email webhook, so leaking one does not
      # leak the other.
      - key: ERP_EMAIL_INBOUND_TOKEN
        generateValue: true
      # Trial only. Loads the placeholder company, banks and connections once.
      - key: ERP_SEED
        value: placeholder
      # Set when the ERP shares a database with another app.
      - key: ERP_DB_SCHEMA
        value: erp
      # Connection secrets go here as ERP_SECRET_<credential_ref>, e.g.
      #   secret://sftp/first-valley/demo -> ERP_SECRET_SFTP_FIRST_VALLEY_DEMO

  # Paid plans only. Runs every active SFTP and API connection on its schedule.
  # - type: cron
  #   name: erp-intake
  #   runtime: node
  #   plan: starter
  #   region: ohio
  #   schedule: "*/15 * * * *"
