# Render Blueprint for the ERP.
#
# This is the whole stack in one file: the database, the API, and (on a paid
# plan) the scheduler. It is what Render builds when you create a Blueprint
# from this repository, and it is the record of how the environment is meant
# to look even when resources were created some other way.
#
# AS RUNNING (Nov 2026): the service is "ERP-api" (its address stays
# pentex-erp-api.onrender.com, which Render does not change on a rename). It
# has no database of its own: DATABASE_URL is APPS-db's internal URL, set by
# hand, and ERP_DB_SCHEMA=erp keeps every ERP table in its own schema there.
# The databases block below is what a fresh Blueprint would create instead.
#
# FREE TRIAL, as originally configured. Three consequences worth knowing:
#   - Render deletes a free database 30 days after creation, and free
#     databases have no backups. Nothing real should live here.
#   - The API sleeps after 15 idle minutes and takes about a minute to wake.
#   - The scheduled jobs (statement and vendor pulls, marketing, EDI, quote
#     holds, scheduled reports, the outbox, the daily period job) run inside
#     the web service itself (server/scheduler.ts), one runner at a time even
#     with several instances. A sleeping free service runs them when it wakes.
#
# To move to a real environment: change both `plan: free` lines. ERP_SEED is no
# longer needed: sample data is the demo tenant. The cron service below stays
# commented out (see its note).

databases:
  - name: erp-db
    plan: free
    region: ohio
    databaseName: erp
    user: erp
    postgresMajorVersion: "16"

services:
  - type: web
    name: ERP-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      # Operator key for every /api route. Render generates it; read it from
      # the service's Environment tab. Never commit it.
      - key: ERP_API_TOKEN
        generateValue: true
      # Separate key for the inbound-email webhook, so leaking one does not
      # leak the other.
      - key: ERP_EMAIL_INBOUND_TOKEN
        generateValue: true
      # Not needed any more (migration 0051): the sample data lives in the
      # demo tenant, which the Operator console resets from db/seed. Leave
      # ERP_SEED unset in production. ERP_SEED=placeholder still loads the
      # seed files at start, for a throwaway trial database.
      # - key: ERP_SEED
      #   value: placeholder
      # Where links in invite and reset emails point (else RENDER_EXTERNAL_URL).
      # - key: ERP_PUBLIC_URL
      #   value: https://your-erp.example.com
      # Client address behind Cloudflare + Render: 2 proxies append to
      # x-forwarded-for (the default on Render). Or prefer Cloudflare's header:
      # - key: ERP_CLIENT_IP_HEADER
      #   value: cf-connecting-ip
      # - key: ERP_TRUSTED_PROXY_HOPS
      #   value: "2"
      # Operator (ERP team) sign-ins: name:password (10+ characters) or
      # name:scrypt$... from scripts/hash-password.ts, comma-separated.
      # - key: ERP_LOGINS
      #   sync: false
      # Set when the ERP shares a database with another app.
      - key: ERP_DB_SCHEMA
        value: erp
      # Optional: a webhook (Slack, Teams, Discord or any HTTPS endpoint) that
      # gets one redacted line per server error, at most one a minute and twenty
      # an hour. The person who hit the error sees its reference (ref ABC123);
      # operators look it up in the Operator console.
      # - key: ERP_ALERT_WEBHOOK
      #   sync: false
      # The scheduler runs inside this service. ERP_SCHEDULER=off stops it here
      # (only if the cron service below is turned on instead);
      # ERP_SCHEDULER_TICK_SEC (default 60) is how often it looks for due jobs.
      # - key: ERP_SCHEDULER
      #   value: "off"
      # Connection secrets go here as ERP_SECRET_<credential_ref>, e.g.
      #   secret://sftp/first-valley/demo -> ERP_SECRET_SFTP_FIRST_VALLEY_DEMO

  # Not needed (Nov 2026): the web service runs the due jobs itself, behind a
  # Postgres advisory lock, and records every run (Setup, Scheduled jobs; the
  # Operator console). Left here commented out on purpose. Turning it on as
  # well is safe -- the lock means a tick that finds the web service running
  # jobs skips -- but it costs a paid cron service for nothing. Use it only if
  # the web service runs with ERP_SCHEDULER=off.
  # - type: cron
  #   name: erp-intake
  #   runtime: node
  #   plan: starter
  #   region: ohio
  #   schedule: "*/15 * * * *"
  #   buildCommand: npm ci
  #   startCommand: node --experimental-strip-types scripts/run-due.ts
  #   envVars:
  #     - key: NODE_VERSION
  #       value: "22"
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: erp-db
  #         property: connectionString
